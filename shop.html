<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Ticketshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root { --gold:#0E9F6E; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:#ffffff; color:#222222; -webkit-font-smoothing:antialiased; }
.wrap { max-width:640px; margin:0 auto; padding:32px 20px 64px; }
.org { color:#6A6A6A; font-size:14px; margin:0 0 4px; }
h1 { margin:0 0 24px; font-size:clamp(26px,6vw,36px); font-weight:800; letter-spacing:-0.02em; color:#222; }
:focus-visible { outline:2px solid #222; outline-offset:2px; }
input:focus-visible { outline:none; }
.tt { background:#ffffff; border:1px solid #EBEBEB; border-radius:16px; padding:20px; margin-bottom:14px; display:flex; justify-content:space-between; gap:14px; align-items:center; box-shadow:0 1px 2px rgba(0,0,0,.08); transition:transform .2s ease, box-shadow .2s ease; }
.tt:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
.tt .info { flex:1; }
.tt h3 { margin:0 0 4px; font-size:17px; font-weight:700; letter-spacing:-0.01em; color:#222; }
.tt p { margin:0; font-size:13.5px; color:#6A6A6A; line-height:1.5; }
.tt .price { font-weight:800; font-size:16px; margin-top:8px; color:var(--gold); }
.badge { display:inline-block; font-size:12px; font-weight:600; padding:4px 12px; border-radius:999px; background:#E7F7F0; color:#06694A; margin-top:8px; }
.badge.warn { background:#FDF2F1; color:#C13515; }
.stepper { display:flex; align-items:center; gap:12px; }
.stepper button { width:44px; height:44px; border-radius:50%; border:1px solid #DDDDDD; background:#ffffff; color:#222; font-size:20px; line-height:1; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .15s ease, background .15s ease, transform .15s ease; }
.stepper button:hover:not(:disabled) { border-color:#222; background:#F7F7F7; }
.stepper button:active:not(:disabled) { transform:scale(.98); }
.stepper button:disabled { opacity:.3; cursor:default; }
.stepper span { min-width:24px; text-align:center; font-weight:700; font-size:17px; }
.panel { background:#ffffff; border:1px solid #EBEBEB; border-radius:16px; padding:24px; margin-top:24px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
.row { display:flex; justify-content:space-between; font-size:14.5px; padding:5px 0; color:#6A6A6A; }
.row.total { border-top:1px solid #EBEBEB; margin-top:10px; padding-top:14px; font-weight:800; font-size:16px; color:#222; }
label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; color:#222; }
input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid #DDDDDD; background:#ffffff; color:#222; font-size:16px; font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease; }
input::placeholder { color:#B0B0B0; }
input:focus { outline:none; border-color:#222; box-shadow:0 0 0 2px rgba(34,34,34,.08); }
.hp { display:none !important; }
.btn { width:100%; margin-top:20px; background:var(--gold); background:linear-gradient(90deg, color-mix(in srgb, var(--gold) 80%, #34D399), color-mix(in srgb, var(--gold) 70%, #044E32)); color:#fff; font-weight:700; font-size:17px; font-family:inherit; padding:16px; border-radius:12px; border:0; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, filter .15s ease; }
.btn:hover:not(:disabled) { box-shadow:0 6px 16px rgba(0,0,0,.15); filter:brightness(1.04); }
.btn:active:not(:disabled) { transform:scale(.98); }
.btn:disabled { opacity:.5; cursor:default; }
.msg { margin-top:14px; padding:12px 14px; border-radius:12px; font-size:14.5px; display:none; }
.msg.err { display:block; background:#FDF2F1; border:1px solid #F2C4BD; color:#C13515; }
.note { text-align:center; color:#6A6A6A; font-size:12.5px; margin-top:24px; line-height:1.6; }
.state { text-align:center; padding:64px 0; color:#6A6A6A; font-size:15px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="state">Shop laden…</div>
  <div id="notfound" class="state" style="display:none">Deze ticketshop bestaat niet (meer).<br/>Controleer de link bij de organisator.</div>
  <div id="shop" style="display:none">
    <img id="logo" alt="" style="display:none;max-height:64px;max-width:220px;margin:0 0 14px;border-radius:10px" />
    <p class="org" id="organizer"></p>
    <h1 id="eventName"></h1>
    <p id="intro" style="display:none;color:#6A6A6A;line-height:1.6;margin:-10px 0 22px"></p>
    <div id="types"></div>
    <div class="panel" id="checkout" style="display:none">
      <div id="lines"></div>
      <div class="row" id="feeRow" style="display:none"><span>Servicekosten</span><span id="fee"></span></div>
      <div class="row total"><span>Totaal</span><span id="total"></span></div>
      <label for="discount">Kortingscode (optioneel)</label>
      <input id="discount" type="text" autocomplete="off" placeholder="Bijv. EARLYBIRD" />
      <p class="note" id="discountNote" style="display:none;text-align:left;margin:6px 0 0">De korting wordt bij het afrekenen verrekend.</p>
      <label for="name">Je naam</label>
      <input id="name" type="text" maxlength="120" autocomplete="name" />
      <label for="email">Je e-mailadres</label>
      <input id="email" type="email" autocomplete="email" />
      <div class="hp"><input type="text" tabindex="-1" autocomplete="off" id="hpf" /></div>
      <button class="btn" id="payBtn">Bestellen</button>
      <div class="msg" id="msg"></div>
    </div>
    <p class="note">Na betaling ontvang je je tickets met QR-code direct op je ticketpagina.<br/>Bewaar die link goed: de link is je ticket.</p>
  </div>
</div>
<script>
const FN = 'https://snfojphxsbzfewwfbfka.supabase.co/functions/v1';
const params = new URLSearchParams(location.search);
const slug = params.get('event') || '';
// Embed-modus: shop als blok op de eigen site van de organisator (iframe).
// We melden onze hoogte aan de bovenliggende pagina zodat het frame meegroeit.
const EMBED = params.get('embed') === '1';
if (EMBED) {
  document.documentElement.style.background = 'transparent';
  const style = document.createElement('style');
  style.textContent = '.wrap{padding:16px 16px 28px} body{background:#ffffff;border-radius:16px;border:1px solid #EBEBEB}';
  document.head.appendChild(style);
  const postHeight = () => parent.postMessage({ entreeShopHeight: document.body.scrollHeight }, '*');
  new ResizeObserver(postHeight).observe(document.body);
  setInterval(postHeight, 800);
}
const euro = c => '€ ' + (c / 100).toFixed(2).replace('.', ',');
let cfg = null; const qty = {};

async function load() {
  if (!slug) return show('notfound');
  try {
    const r = await fetch(FN + '/ticket-shop?event=' + encodeURIComponent(slug));
    if (!r.ok) return show('notfound');
    cfg = await r.json();
    document.getElementById('organizer').textContent = cfg.event.organizer;
    document.getElementById('eventName').textContent = cfg.event.name;
    document.title = cfg.event.name + ' — tickets';
    applyBranding(cfg.shop || {});
    render(); show('shop');
  } catch { show('notfound'); }
}
function show(id) {
  for (const x of ['loading','notfound','shop']) document.getElementById(x).style.display = x === id ? 'block' : 'none';
}
// Personalisatie door de organisator: accentkleur, introtekst, Meta Pixel.
function applyBranding(shop) {
  if (/^#[0-9a-fA-F]{6}$/.test(shop.accent_color || '')) document.documentElement.style.setProperty('--gold', shop.accent_color);
  if (shop.intro) { const el = document.getElementById('intro'); el.textContent = shop.intro; el.style.display = 'block'; }
  if (shop.logo_url && /^https:\/\/snfojphxsbzfewwfbfka\.supabase\.co\//.test(shop.logo_url)) {
    const img = document.getElementById('logo'); img.src = shop.logo_url; img.style.display = 'block';
  }
  if (/^\d{5,20}$/.test(shop.pixel_id || '')) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', shop.pixel_id); window.fbq('track', 'PageView');
  }
}
function render() {
  const el = document.getElementById('types'); el.innerHTML = '';
  for (const t of cfg.types) {
    const q = qty[t.id] || 0;
    const div = document.createElement('div'); div.className = 'tt';
    const canBuy = t.state === 'available';
    let badge = '';
    if (t.state === 'sold_out') badge = '<span class="badge warn">Uitverkocht</span>';
    if (t.state === 'coming_soon') badge = '<span class="badge">Binnenkort te koop</span>';
    if (t.state === 'ended') badge = '<span class="badge">Verkoop gesloten</span>';
    if (t.left !== null && canBuy) badge = `<span class="badge warn">Nog ${t.left} beschikbaar</span>`;
    div.innerHTML = `<div class="info"><h3></h3><p></p><div class="price">${t.price_cents === 0 ? 'Gratis' : euro(t.price_cents)}</div>${badge}</div>` +
      (canBuy ? `<div class="stepper"><button data-d="-1" ${q===0?'disabled':''}>−</button><span>${q}</span><button data-d="1" ${q>=t.max_per_order?'disabled':''}>+</button></div>` : '');
    div.querySelector('h3').textContent = t.name;
    div.querySelector('p').textContent = t.description || '';
    div.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      qty[t.id] = Math.max(0, Math.min(t.max_per_order, (qty[t.id] || 0) + parseInt(b.dataset.d)));
      render();
    }));
    el.appendChild(div);
  }
  const items = cfg.types.filter(t => (qty[t.id] || 0) > 0);
  const co = document.getElementById('checkout');
  co.style.display = items.length ? 'block' : 'none';
  if (items.length) {
    const lines = document.getElementById('lines'); lines.innerHTML = '';
    let total = 0, feeTickets = 0;
    for (const t of items) {
      const q = qty[t.id]; total += q * t.price_cents;
      if (t.price_cents > 0) feeTickets += q;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span></span><span>${euro(q * t.price_cents)}</span>`;
      row.querySelector('span').textContent = q + '× ' + t.name;
      lines.appendChild(row);
    }
    // Servicekosten alleen op betaalde tickets, gelijk aan de server-berekening.
    const fee = feeTickets * (cfg.service_fee_cents || 0);
    const feeRow = document.getElementById('feeRow');
    feeRow.style.display = fee > 0 ? 'flex' : 'none';
    if (fee > 0) document.getElementById('fee').textContent = euro(fee);
    document.getElementById('total').textContent = euro(total + fee);
    document.getElementById('discountNote').style.display = document.getElementById('discount').value.trim() ? 'block' : 'none';
  }
}
document.getElementById('payBtn').addEventListener('click', async () => {
  const msg = document.getElementById('msg'); msg.className = 'msg';
  const btn = document.getElementById('payBtn');
  const items = cfg.types.filter(t => (qty[t.id] || 0) > 0).map(t => ({ ticket_type_id: t.id, qty: qty[t.id] }));
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  if (!name || !email) { msg.className = 'msg err'; msg.textContent = 'Vul je naam en e-mailadres in.'; return; }
  btn.disabled = true; btn.textContent = 'Bezig…';
  if (window.fbq) window.fbq('track', 'InitiateCheckout');
  try {
    const r = await fetch(FN + '/ticket-order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_id: cfg.event.id, items, name, email, website: document.getElementById('hpf').value, discount_code: document.getElementById('discount').value.trim() }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Bestellen mislukt, probeer het opnieuw.');
    // In een iframe-embed breekt het afrekenen uit het frame (Mollie en de
    // ticketpagina horen full-page te zijn); klik op Bestellen = user gesture.
    if (EMBED && window.top) window.top.location.href = d.checkout_url;
    else location.href = d.checkout_url;
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Bestellen';
  }
});
document.getElementById('discount').addEventListener('input', (e) => {
  document.getElementById('discountNote').style.display = e.target.value.trim() ? 'block' : 'none';
});
load();
</script>
</body>
</html>
