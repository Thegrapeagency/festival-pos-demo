<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4ecd9">
<title>Omzet per bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #010341; --bordeaux: #9b3737; --paper: #f4ecd9; --card: #fbf6ea; --line: #d9d2c0; --soft: rgba(1,3,65,.6); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--navy); }
  body { font-family: 'Fraunces', Georgia, serif; padding: 18px 16px 40px; max-width: 640px; margin: 0 auto; }
  h1 { font-weight: 600; font-size: 26px; margin: 4px 0 2px; }
  .sub { font-family: Inter, system-ui, sans-serif; font-size: 13px; color: var(--soft); margin: 0 0 14px; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .days button { font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px; padding: 9px 14px; border: 1px solid var(--navy); background: transparent; color: var(--navy); border-radius: 0; cursor: pointer; }
  .days button.on { background: var(--bordeaux); border-color: var(--bordeaux); color: #f9ebcd; }
  .tot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .tot div { background: var(--card); border: 1px solid var(--line); padding: 12px; }
  .tot span { display: block; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: var(--soft); }
  .tot strong { font-size: 24px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: var(--soft); text-align: left; padding: 6px 4px; border-bottom: 2px solid var(--navy); }
  td { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 16px; vertical-align: middle; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.n { font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
  td small { font-family: Inter, system-ui, sans-serif; color: var(--soft); font-size: 12px; font-weight: 500; }
  .bar { height: 4px; background: var(--bordeaux); margin-top: 5px; opacity: .8; }
  .msg { font-family: Inter, system-ui, sans-serif; background: var(--card); border: 1px solid var(--line); padding: 14px; }
</style>
</head>
<body>
<h1>Omzet per bar</h1>
<p class="sub" id="sub">Laden…</p>
<div class="days" id="days"></div>
<div id="out"></div>
<script>
(function () {
  var U = 'https://snfojphxsbzfewwfbfka.supabase.co';
  var P = 'sb_publishable_MymbMA8MJ5i5SfJR4mORvg_oFpWXNsg';
  var key = new URLSearchParams(location.search).get('k');
  try {
    if (key) localStorage.setItem('meekijk_k', key); else key = localStorage.getItem('meekijk_k');
  } catch (e) {}
  // sleutel niet in de adresbalk laten staan
  if (location.search) try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var pad = function (n) { return String(n).padStart(2, '0'); };
  // festivaldag van nu: een dag loopt tot 01:00
  var nowDay = (function () { var d = new Date(Date.now() - 3600e3); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); })();
  var day = nowDay;
  var euro = function (c) { return '€ ' + (c / 100).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var label = function (d) { return new Date(d + 'T12:00:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var $ = function (id) { return document.getElementById(id); };

  function days(list) {
    var all = list.slice(); if (day && all.indexOf(day) < 0) all.push(day); all.sort();
    var h = all.map(function (d) { return '<button data-d="' + d + '" class="' + (d === day ? 'on' : '') + '">' + label(d) + '</button>'; }).join('');
    h += '<button data-d="" class="' + (day === null ? 'on' : '') + '">Alle dagen</button>';
    $('days').innerHTML = h;
  }
  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    day = b.getAttribute('data-d') || null; load();
  });

  var busy = false;
  function load() {
    if (!key) { $('sub').textContent = ''; $('out').innerHTML = '<div class="msg">Scan de QR-code opnieuw om mee te kijken.</div>'; return; }
    if (busy) return; busy = true;
    fetch(U + '/rest/v1/rpc/meekijk_omzet', {
      method: 'POST',
      headers: { apikey: P, Authorization: 'Bearer ' + P, 'Content-Type': 'application/json', 'Content-Profile': 'festival_pos' },
      body: JSON.stringify({ p_key: key, p_day: day })
    }).then(function (r) {
      if (r.status === 400 || r.status === 401) throw new Error('toegang');
      if (!r.ok) throw new Error('net');
      return r.json();
    }).then(function (d) {
      days(d.days || []);
      var max = Math.max.apply(null, [1].concat(d.by_bar.map(function (b) { return b.cents; })));
      $('sub').textContent = (day ? 'Dag tot 01:00 · ' : 'Alle dagen · ') + 'bijgewerkt ' + new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      var h = '<div class="tot"><div><span>Totaal</span><strong>' + euro(d.total_cents) + '</strong></div>' +
        '<div><span>' + (day === nowDay ? 'Laatste 15 min' : 'Verkopen') + '</span><strong>' +
        (day === nowDay ? euro(d.last_15m_cents) : d.orders.toLocaleString('nl-NL')) + '</strong></div></div>';
      h += '<table><thead><tr><th>Bar</th><th class="n">Omzet</th></tr></thead><tbody>';
      h += d.by_bar.map(function (b) {
        return '<tr><td>' + esc(b.bar) + ' <small>' + b.orders + '×</small><div class="bar" style="width:' + Math.round(100 * b.cents / max) + '%"></div></td><td class="n">' + euro(b.cents) + '</td></tr>';
      }).join('') || '<tr><td colspan="2">Nog geen verkopen op deze dag.</td></tr>';
      $('out').innerHTML = h + '</tbody></table>';
    }).catch(function (e) {
      if (e.message === 'toegang') { $('out').innerHTML = '<div class="msg">Deze link werkt niet (meer). Vraag een nieuwe QR-code.</div>'; $('days').innerHTML = ''; $('sub').textContent = ''; }
      else $('sub').textContent = 'Geen verbinding, probeert het zo opnieuw…';
    }).then(function () { busy = false; });
  }
  load();
  setInterval(function () { if (!document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
